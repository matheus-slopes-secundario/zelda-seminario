<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ocarina of Time — Oráculo de Hyrule</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #060a12;
      --gold: #d4af37;
      --gold-light: #f5e28a;
      --gold-glow: rgba(212, 175, 55, 0.4);
      --grass-base: #1b3b22;
      --grass-mid: #2f5e38;
      --grass-light: #4a8f5a;
      --text-main: #f0f4f8;
      --text-muted: #8b9bb4;
      --card-bg: rgba(13, 23, 38, 0.85);
      --border-gold: rgba(212, 175, 55, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Merriweather', serif;
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 50% 0%, #152945 0%, var(--bg-deep) 70%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 120px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── CONTAINER PRINCIPAL ── */
    .container {
      width: 100%;
      max-width: 900px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── LOGO OFICIAL (SEM FUNDO, SEM BORDAS) ── */
    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
      animation: float 6s ease-in-out infinite;
    }

    .logo-container img {
      max-width: 100%;
      height: auto;
      max-height: 280px; /* Ajuste conforme necessário */
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.8));
      /* Nenhuma borda, nenhum background, apenas a imagem transparente */
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }

    /* ── SUBTÍTULO "PESQUISE SOBRE:" ── */
    .search-label {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 12px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.8);
    }

    /* ── BARRA DE BUSCA ── */
    .search-box {
      width: 100%;
      max-width: 700px;
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      position: relative;
    }

    .search-box::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 14px;
      background: linear-gradient(45deg, var(--gold), transparent, var(--gold));
      z-index: -1;
      opacity: 0.3;
      transition: opacity 0.3s ease;
    }

    .search-box:focus-within::before { opacity: 0.8; }

    #query {
      flex: 1;
      padding: 18px 24px;
      font-size: 16px;
      font-family: 'Merriweather', serif;
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      background: rgba(6, 10, 18, 0.9);
      color: var(--text-main);
      outline: none;
      transition: all 0.3s;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }

    #query::placeholder { color: #4a5d7e; font-style: italic; }
    #query:focus { background: rgba(13, 23, 38, 0.95); border-color: var(--gold); }

    #searchBtn {
      padding: 0 32px;
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 700;
      border: 1px solid var(--gold-light);
      border-radius: 12px;
      background: linear-gradient(180deg, var(--gold) 0%, #8a7028 100%);
      color: #0d1726;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    }

    #searchBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
      filter: brightness(1.1);
    }

    #searchBtn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

    /* ── SUGESTÕES ── */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 40px;
      justify-content: center;
    }

    .chip {
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(212, 175, 55, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.2);
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Merriweather', serif;
    }

    .chip:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold);
      color: var(--gold-light);
      transform: translateY(-1px);
    }

    /* ── STATUS E RESULTADOS ── */
    #status {
      text-align: center;
      font-family: 'Cinzel', serif;
      color: var(--gold);
      font-size: 15px;
      min-height: 24px;
      margin-bottom: 24px;
      letter-spacing: 1px;
      text-shadow: 0 0 10px var(--gold-glow);
    }

    #status.error { color: #f87171; text-shadow: none; }

    #results { width: 100%; display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      animation: slideUp 0.5s ease-out both;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--gold);
      opacity: 0.5;
      transition: opacity 0.3s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(212, 175, 55, 0.1);
      border-color: var(--gold);
    }
    
    .card:hover::before { opacity: 1; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      padding-bottom: 12px;
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--gold-light);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .card-meta { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }

    .badge {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(0,0,0,0.4);
      border: 1px solid currentColor;
    }
    .badge[data-tipo="personagem"] { color: #d4af37; }
    .badge[data-tipo="local"]      { color: #60a5fa; }
    .badge[data-tipo="item"]       { color: #4ade80; }
    .badge[data-tipo="chefe"]      { color: #f87171; }
    .badge[data-tipo="cancao"]     { color: #c084fc; }
    .badge[data-tipo="raca"]       { color: #22d3ee; }
    .badge[data-tipo="mini-chefe"] { color: #fb923c; }
    .badge[data-tipo="inimigo"]    { color: #9ca3af; }
    .badge[data-tipo="divindade"]  { color: #faf0b4; }
    .badge[data-tipo="mecanica"]   { color: #34d399; }

    .score {
      font-family: monospace;
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(0,0,0,0.3);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .card-text {
      color: #b0c0d4;
      font-size: 15px;
      line-height: 1.6;
      text-align: justify;
    }

    mark {
      background: rgba(212, 175, 55, 0.3);
      color: var(--gold-light);
      padding: 0 3px;
      border-radius: 2px;
      font-weight: bold;
    }

    .comandos-box {
      margin-top: 16px;
      padding: 14px 18px;
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0.02) 100%);
      border-left: 3px solid var(--gold);
      border-radius: 4px 8px 8px 4px;
      font-family: monospace;
      font-size: 16px;
      color: var(--gold-light);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .comandos-box::before {
      content: '🎵';
      font-size: 20px;
      filter: drop-shadow(0 0 5px var(--gold));
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--border-gold);
      border-radius: 12px;
      font-family: 'Cinzel', serif;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 50px; margin-bottom: 16px; opacity: 0.3; }

    /* ── GRAMA ANIMADA NA BASE DA TELA ── */
    .grass-field {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 90px;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      padding: 0 10px;
    }

    .blade {
      width: 12px;
      height: 60px;
      background: linear-gradient(to top, var(--grass-base), var(--grass-mid));
      border-radius: 50% 50% 0 0;
      transform-origin: bottom center;
      animation: sway 3s ease-in-out infinite alternate;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
      position: relative;
    }

    .blade:nth-child(odd) {
      height: 80px;
      background: linear-gradient(to top, var(--grass-mid), var(--grass-light));
      animation-duration: 4s;
    }

    .blade:nth-child(3n) {
      height: 50px;
      background: linear-gradient(to top, var(--grass-base), var(--grass-light));
      animation-duration: 5s;
      animation-delay: -1s;
    }

    .blade:nth-child(4n) {
      height: 70px;
      animation-duration: 3.5s;
      animation-delay: -2s;
    }

    @keyframes sway {
      0% { transform: rotate(-5deg) skewX(-2deg); }
      100% { transform: rotate(8deg) skewX(3deg); }
    }

    @media (max-width: 600px) {
      .logo-container img { max-height: 180px; }
      .search-box { flex-direction: column; }
      #searchBtn { padding: 16px; }
      .card-header { flex-direction: column; align-items: flex-start; }
      .grass-field { height: 60px; }
      .blade { width: 8px; height: 40px; }
      .blade:nth-child(odd) { height: 50px; }
    }
  </style>
</head>
<body>

  <!-- Grama Animada Fixa na Base -->
  <div class="grass-field">
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
  </div>

  <div class="container">
    <!-- Logo Oficial (PNG Transparente, Sem Bordas) -->
    <div class="logo-container">
      <img 
        src="https://static.wikia.nocookie.net/zelda_gamepedia_en/images/a/aa/OoT_English_Logo.png/revision/latest?cb=20170127011532" 
        alt="The Legend of Zelda: Ocarina of Time" 
      />
    </div>

    <!-- Subtítulo solicitado -->
    <div class="search-label">Pesquise sobre:</div>

    <form class="search-box" id="searchForm">
      <input
        id="query"
        type="text"
        placeholder="Como tocar a Canção do Tempo? Onde fica a Espada Mestra?"
        autocomplete="off"
        autofocus
      />
      <button type="submit" id="searchBtn">Buscar</button>
    </form>

    <div class="suggestions" id="suggestions">
      <span class="chip">Link</span>
      <span class="chip">Ganondorf</span>
      <span class="chip">Templo do Fogo</span>
      <span class="chip">Canção das Tempestades</span>
      <span class="chip">Espada Mestra</span>
      <span class="chip">Epona</span>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("query");
    const btn = document.getElementById("searchBtn");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        input.value = chip.textContent;
        form.requestSubmit();
      });
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function highlight(text, query) {
      const words = query.trim().split(/\s+/)
        .filter(w => w.length > 2)
        .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      if (!words.length) return escapeHtml(text);
      const re = new RegExp(`(${words.join("|")})`, "gi");
      return escapeHtml(text).replace(re, "<mark>$1</mark>");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      
      if (q.length < 2) {
        status.textContent = "O Oráculo precisa de mais palavras...";
        status.className = "error";
        return;
      }

      btn.disabled = true;
      status.textContent = "Consultando os Sábios...";
      status.className = "";
      results.innerHTML = "";

      try {
        const r = await fetch(`/api/search?query=${encodeURIComponent(q)}&limit=20`);
        const data = await r.json();

        if (!r.ok || data.status !== "ok") {
          throw new Error(data.message || "Erro ao consultar o banco de dados.");
        }

        const total = data.total || 0;
        status.textContent = total === 0
          ? "Nenhum registro encontrado nos arquivos de Hyrule."
          : `Foram encontrados ${total} registros nos arquivos.`;
        status.className = "";

        if (total === 0) {
          results.innerHTML = `
            <div class="empty">
              <div class="empty-icon">🛡️</div>
              <p>Tente buscar por outro termo, herói.</p>
            </div>`;
          return;
        }

        results.innerHTML = data.results.map((r, i) => `
          <article class="card" style="animation-delay: ${i * 50}ms">
            <div class="card-header">
              <div class="card-title">${escapeHtml(r.payload.titulo || "Desconhecido")}</div>
              <div class="card-meta">
                <span class="badge" data-tipo="${escapeHtml(r.payload.tipo || "")}">${escapeHtml(r.payload.tipo || "?")}</span>
                <span class="score" title="Pontuação RRF">${r.score.toFixed(4)}</span>
              </div>
            </div>
            <p class="card-text">${highlight(r.payload.text || "", q)}</p>
            
            ${r.payload.comandos ? `<div class="comandos-box">N64: ${escapeHtml(r.payload.comandos.replace('N64: ', ''))}</div>` : ""}
            
          </article>
        `).join("");
        
      } catch (err) {
        status.textContent = "As forças do mal bloquearam a busca: " + err.message;
        status.className = "error";
      } finally {
        btn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
